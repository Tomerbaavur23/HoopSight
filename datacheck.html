<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pickwise data check</title>
<style>
:root{--bg:#f3f5f8;--surface:#fff;--ink:#141a24;--muted:#5d6878;--line:#dbe0e8;--ok:#1a7f4b;--bad:#b42318;--accent:#d9480f}
@media (prefers-color-scheme:dark){:root{--bg:#0e131b;--surface:#161d28;--ink:#eaeef4;--muted:#97a3b5;--line:#2a3445;--ok:#5fd39b;--bad:#ff8a80;--accent:#ff8a4c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px max(16px,env(safe-area-inset-left))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:24px;margin:0}
p{margin:0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0;flex:1 1 180px}
button{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:24px 1fr;gap:2px 8px}
.item b{font-weight:600}.item .d{grid-column:2;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wait{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Pickwise data check</h1>
  <p>Tests whether Sleeper's public data can be read from this page. Nothing is sent anywhere except to Sleeper. No password is needed.</p>
  <div class="row">
    <input id="u" value="barburange13" aria-label="Sleeper username" autocapitalize="off" autocorrect="off">
    <button id="go" type="button">Run check</button>
  </div>
  <div id="out" class="wrap" style="gap:8px"></div>
  <div class="row"><button id="copy" class="ghost" type="button" disabled>Copy report</button><span id="msg" class="wait"></span></div>
</div>
<script>
var API = "https://api.sleeper.app/v1", API2 = "https://api.sleeper.com";
var report = [];
function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
function get(url) {
  var t0 = Date.now();
  return fetch(url).then(function (r) {
    return r.text().then(function (t) {
      var j = null; try { j = JSON.parse(t); } catch (e) {}
      return { ok: r.ok, status: r.status, ms: Date.now() - t0, len: t.length, json: j, text: t };
    });
  }).catch(function (e) { return { ok: false, status: 0, ms: Date.now() - t0, err: String(e && e.message || e), len: 0, json: null }; });
}
function show(i, name, ok, detail) {
  var el = document.getElementById("s" + i);
  if (!el) { el = document.createElement("div"); el.className = "item"; el.id = "s" + i; document.getElementById("out").appendChild(el); }
  el.innerHTML = '<span class="' + (ok === null ? "wait" : ok ? "ok" : "bad") + '">' + (ok === null ? "…" : ok ? "✓" : "✗") + '</span><b>' + esc(name) + '</b><span class="d">' + esc(detail) + '</span>';
  report[i] = (ok === null ? "…" : ok ? "OK  " : "FAIL") + " | " + name + " | " + detail;
}
function sample(j) {
  if (Array.isArray(j)) return "list of " + j.length + (j[0] ? "; first item keys: " + Object.keys(j[0]).slice(0, 12).join(", ") : "");
  if (j && typeof j === "object") { var k = Object.keys(j); return k.length + " keys: " + k.slice(0, 12).join(", "); }
  return "unexpected format";
}
function run() {
  var uname = document.getElementById("u").value.trim().toLowerCase();
  document.getElementById("out").innerHTML = ""; report = [];
  document.getElementById("go").disabled = true; document.getElementById("copy").disabled = true;
  var season = "2026", week = 1, uid = null, lid = null, rid = null, myPlayers = [];
  function fin() { document.getElementById("go").disabled = false; document.getElementById("copy").disabled = false; }
  show(0, "Current season and week", null, "checking…");
  get(API + "/state/nba").then(function (r) {
    if (r.ok && r.json) { season = r.json.season || season; week = r.json.week || r.json.leg || week; }
    show(0, "Current season and week", r.ok, r.ok ? "season " + season + ", week " + week : (r.err || "HTTP " + r.status));
    show(1, "Your Sleeper account", null, "checking…");
    return get(API + "/user/" + encodeURIComponent(uname));
  }).then(function (r) {
    if (r.ok && r.json && r.json.user_id) uid = r.json.user_id;
    show(1, "Your Sleeper account", !!uid, uid ? "found user " + r.json.username + " (id " + uid + ")" : (r.err || "HTTP " + r.status + " " + r.text.slice(0, 80)));
    if (!uid) return null;
    show(2, "Your NBA leagues this season", null, "checking…");
    return get(API + "/user/" + uid + "/leagues/nba/" + season);
  }).then(function (r) {
    if (r === null) return null;
    var ok = r.ok && Array.isArray(r.json) && r.json.length > 0;
    if (ok) lid = r.json[0].league_id;
    show(2, "Your NBA leagues this season", ok, ok ? r.json.map(function (l) { return l.name + " (" + l.league_id + ")"; }).join("; ") : (r.err || "HTTP " + r.status + " " + sample(r.json)));
    if (!lid) return null;
    show(3, "League rosters", null, "checking…");
    return get(API + "/league/" + lid + "/rosters");
  }).then(function (r) {
    if (r === null) return null;
    var ok = r.ok && Array.isArray(r.json);
    if (ok) { var mine = r.json.filter(function (x) { return x.owner_id === uid; })[0]; if (mine) { rid = mine.roster_id; myPlayers = mine.players || []; } }
    show(3, "League rosters", ok, ok ? r.json.length + " rosters; yours is #" + rid + " with " + myPlayers.length + " players; starters field: " + (r.json[0] && r.json[0].starters ? "yes" : "no") : (r.err || "HTTP " + r.status));
    show(4, "This week's matchups", null, "checking…");
    return get(API + "/league/" + lid + "/matchups/" + week);
  }).then(function (r) {
    if (r === null) return null;
    show(4, "This week's matchups", r.ok && Array.isArray(r.json), r.ok ? sample(r.json) : (r.err || "HTTP " + r.status));
    show(5, "Player dictionary (names and teams)", null, "downloading, can be several MB…");
    return get(API + "/players/nba");
  }).then(function (r) {
    if (r === null) return null;
    var ok = r.ok && r.json && typeof r.json === "object";
    var nm = "";
    if (ok && myPlayers.length) { var p = r.json[myPlayers[0]]; if (p) nm = "; example: " + (p.full_name || p.last_name) + " (" + p.team + ")"; }
    show(5, "Player dictionary (names and teams)", ok, ok ? Object.keys(r.json).length + " players, " + Math.round(r.len / 1024) + " KB" + nm : (r.err || "HTTP " + r.status));
    show(6, "Game stats by week (fantasy points per game)", null, "checking…");
    return get(API2 + "/stats/nba/" + season + "/" + week + "?season_type=regular");
  }).then(function (r) {
    if (r === null) return null;
    show(6, "Game stats by week (fantasy points per game)", r.ok && r.json, r.ok ? sample(r.json) : (r.err || "HTTP " + r.status));
    show(7, "Season schedule", null, "checking…");
    return get(API2 + "/schedule/nba/regular/" + season);
  }).then(function (r) {
    if (r === null) return null;
    show(7, "Season schedule", r.ok && r.json, r.ok ? sample(r.json) : (r.err || "HTTP " + r.status));
    show(8, "Projections", null, "checking…");
    return get(API2 + "/projections/nba/" + season + "/" + week + "?season_type=regular");
  }).then(function (r) {
    if (r !== null) show(8, "Projections", r.ok && r.json, r.ok ? sample(r.json) : (r.err || "HTTP " + r.status));
    fin();
  }).catch(function (e) { show(9, "Unexpected error", false, String(e)); fin(); });
}
document.getElementById("go").addEventListener("click", run);
document.getElementById("copy").addEventListener("click", function () {
  var t = report.filter(Boolean).join("\n");
  var done = function () { document.getElementById("msg").textContent = "Copied. Paste it into the chat."; };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, function () { window.prompt("Copy this:", t); });
  else window.prompt("Copy this:", t);
});
</script>
</body>
</html>
